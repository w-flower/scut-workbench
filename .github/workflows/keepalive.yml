name: supabase-keepalive
# 目的：Supabase 免费层 7 天低活跃会暂停，每天打一次真实只读请求保活。
on:
  schedule:
    - cron: "17 1 * * *"   # 每天 UTC 01:17（北京 09:17）
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://nglgymxsnnlaqxvmvrxo.supabase.co/rest/v1/roles?select=key&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5nbGd5bXhzbm5sYXF4dm12cnhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2MTAwNzYsImV4cCI6MjEwOTE4NjA3Nn0.qdFqI4WCp6kJcLQMqTwpAIdXOuxHOxTe_vHezyX8_6g" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5nbGd5bXhzbm5sYXF4dm12cnhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2MTAwNzYsImV4cCI6MjEwOTE4NjA3Nn0.qdFqI4WCp6kJcLQMqTwpAIdXOuxHOxTe_vHezyX8_6g")
