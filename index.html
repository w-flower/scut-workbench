<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>window.__errs=[];addEventListener("error",function(e){window.__errs.push("E:"+(e.message||e))});addEventListener("unhandledrejection",function(e){window.__errs.push("R:"+((e.reason&&e.reason.message)||e.reason))});</script>
<meta name="theme-color" content="#16233B">
<meta name="description" content="SCUT 工作台在线版：一屏看清现在到下一件事，多角色校园事务协作。">
<title>SCUT 工作台 · 在线版</title>
<link rel="stylesheet" href="./styles.css?v=23">
</head>
<body>
<div id="login">
  <div class="card">
    <div class="brand-row"><div class="mk"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"><path d="M4 17h16"/><path d="M7 17a5 5 0 0 1 10 0"/><circle cx="12" cy="9" r="1.7" fill="#fff" stroke="none"/></svg></div><div><h1>SCUT 工作台</h1><div class="sub2">多角色校园事务协作台 · 在线演示</div></div></div>
    <label>邮箱</label>
    <input id="lg-email" type="email" value="demo@scut.edu.cn" autocomplete="username">
    <label>密码</label>
    <input id="lg-pw" type="password" value="Demo#2026" autocomplete="current-password">
    <button class="primary" id="lg-btn" onclick="__doLogin()">登录</button>
    <div class="err" id="lg-err"></div>
    <div class="hint">演示账号：<b>demo@scut.edu.cn</b> / <b>Demo#2026</b><br>数据存于 Supabase 云端，多设备登录同一账号即同步。</div>
  </div>
</div>

<div class="app" id="app" style="visibility:hidden">
  <aside class="rail">
    <div class="rail-top">
      <div class="brand"><div class="brand-mark"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"><path d="M4 17h16"/><path d="M7 17a5 5 0 0 1 10 0"/><circle cx="12" cy="9" r="1.7" fill="#fff" stroke="none"/></svg></div><div class="brand-name">SCUT 工作台</div></div>
      <div class="brand-sub">多角色校园事务协作台</div>
    </div>
    <div class="identity"><div class="avatar">演</div><div><b id="idName">演示同学</b><span id="idSub">2026级计算机类1班</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot" id="railFoot"></div>
  </aside>
  <div class="shell">
    <header class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="spacer"></div>
      <div class="roleswitch" id="rolewrap"></div>
      <div class="searchbox" data-act="open-cmd"><svg class="ic sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>搜索 / 命令</span><kbd>Ctrl K</kbd></div>
      <button class="icon-btn" data-act="view" data-id="settings" title="设置"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2 2M16.4 16.4l2 2M18.4 5.6l-2 2M7.6 16.4l-2 2"/></svg></button>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<nav class="mobilebar" id="mobilebar"></nav>
<div id="toast"></div>
<div id="cmd"><div class="box"><input placeholder="输入命令或搜索…（Esc 关闭）"><div class="list"></div></div></div>
<script type="module" src="./app.js?v=23"></script>
</body>
</html>
